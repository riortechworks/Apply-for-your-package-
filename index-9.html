<style>
:root{--base:#F3F6FF;--card:#FFFFFF;--blue:#1565FF;--blue2:#0B4FD6;--gold:#D4AF37;--ink:#0B1530;--muted:#5A6788;
--sh:12px 12px 28px rgba(21,101,255,.13),-10px -10px 24px #fff,inset 3px 3px 6px rgba(255,255,255,.95),inset -4px -4px 10px rgba(21,101,255,.05);
--shs:6px 6px 14px rgba(21,101,255,.13),-5px -5px 12px #fff,inset 2px 2px 4px #fff,inset -3px -3px 6px rgba(21,101,255,.05)}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
body{margin:0;background:var(--base);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0 0 .5em;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(2.1rem,8vw,3.6rem)}h2{font-size:clamp(1.5rem,5vw,2.2rem)}h3{font-size:1.2rem}
p{margin:0 0 14px;color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 0;background:var(--base)}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:22px;padding:8px 12px 8px 16px;box-shadow:var(--shs)}
.bar img{height:36px;display:block}
nav{display:none;gap:6px}
nav button,#dr button{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;border-radius:14px;padding:10px 16px;min-height:44px;cursor:pointer;transition:.25s}
nav button:hover,nav button.on{color:var(--blue);box-shadow:var(--shs);background:var(--card)}
.mb{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:15px;background:var(--card);color:var(--blue);box-shadow:var(--shs);cursor:pointer}
#dr{display:none;margin-top:12px;padding:10px;background:var(--card);border-radius:22px;box-shadow:var(--shs)}
#dr.open{display:grid}#dr button{text-align:left;width:100%}
@media(min-width:800px){nav{display:flex}.mb,#dr{display:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border:0;border-radius:18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .25s}
.btn.p{background:var(--blue);color:#fff;box-shadow:8px 8px 18px rgba(21,101,255,.35),-6px -6px 14px #fff,inset 3px 3px 6px rgba(255,255,255,.3),inset -4px -4px 8px rgba(0,0,60,.18)}
.btn.s{background:var(--card);color:var(--blue);box-shadow:var(--shs)}
.btn.w{background:#1FA855;color:#fff;box-shadow:8px 8px 18px rgba(31,168,85,.3),-6px -6px 14px #fff,inset 3px 3px 6px rgba(255,255,255,.3),inset -4px -4px 8px rgba(0,60,0,.15)}
.btn:hover{transform:translateY(-3px)}.btn:active{transform:translateY(1px) scale(.98)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px}
.clay{background:var(--card);border-radius:30px;padding:26px;box-shadow:var(--sh);transition:transform .3s}
.clay:hover{transform:translateY(-4px)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ic{display:grid;place-items:center;width:56px;height:56px;border-radius:20px;background:var(--base);color:var(--blue);box-shadow:var(--shs);margin-bottom:16px;font-size:1.3rem}
.ic.g{color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.price{color:var(--gold);font-size:1.8rem;font-weight:800;letter-spacing:-.02em}
.page{padding:36px 0 56px;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{padding:30px 0}.hero p{font-size:1.1rem;max-width:520px}
.hero h1 span{color:var(--blue)}
.list{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}.list svg{color:var(--blue);margin-top:4px}
.num{font-size:1.5rem;font-weight:800;color:var(--blue)}
.acc{display:grid;gap:16px;margin-top:20px}
.q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;font:inherit;font-weight:700;color:var(--ink);text-align:left;min-height:44px;cursor:pointer;padding:0}
.q svg{transition:.3s;color:var(--blue)}.q[aria-expanded=true] svg{transform:rotate(180deg)}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.a>div{overflow:hidden}.a.open{grid-template-rows:1fr}.a p{margin:10px 0 0}
.pick{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:22px 0}
.opt{text-align:left;border:0;font:inherit;color:var(--ink);cursor:pointer;background:var(--card);border-radius:26px;padding:22px;box-shadow:var(--shs);transition:.3s;border:2px solid transparent}
.opt[aria-pressed=true]{border-color:var(--blue);box-shadow:var(--sh)}
.opt b{display:block;font-size:1.15rem}
.pay{display:none;margin-top:6px}.pay.on{display:block;animation:in .4s}
.big{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--base);border-radius:20px;padding:16px;margin:12px 0;font-size:1.5rem;font-weight:800;letter-spacing:.06em;box-shadow:inset 4px 4px 9px rgba(21,101,255,.1),inset -4px -4px 9px #fff}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input[type=text]{width:100%;min-height:50px;padding:0 16px;border:0;border-radius:16px;background:var(--base);color:var(--ink);font:inherit;box-shadow:inset 4px 4px 9px rgba(21,101,255,.1),inset -4px -4px 9px #fff}
.note{font-size:.85rem;color:var(--muted)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none;filter:grayscale(.3)}
.chk{display:flex;gap:12px;align-items:flex-start;margin:18px 0 0;font-weight:500;cursor:pointer}
.chk.sm{font-size:.85rem;margin:6px 0 4px;gap:10px}.chk.sm input{width:20px;height:20px}
.chk input{width:26px;height:26px;flex:none;accent-color:var(--blue);margin:0}
.terms h3{margin-top:24px}.terms .warn{border-left:4px solid var(--gold)}
footer{padding:28px 0 36px}
.foot{background:var(--card);border-radius:30px;padding:24px;box-shadow:var(--sh);display:grid;gap:14px}
.foot img{height:34px;width:auto;justify-self:start}
.foot .links{display:flex;flex-wrap:wrap;gap:8px}.foot .links button{font:inherit;color:var(--blue);background:none;border:0;padding:8px 12px;min-height:44px;cursor:pointer;font-weight:600}
.sk{background:linear-gradient(90deg,#E6ECFB 25%,#F6F8FF 50%,#E6ECFB 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const WA="17737245875",POCHI="0745833432";
const C={freelancing:{n:"Freelancing",p:2000,ic:"brief",d:"Learn how to offer your skills online, find clients and deliver quality work.",pts:["Choosing a skill to offer","Setting up a professional profile","Finding and pitching clients","Delivering work and getting paid"]},
trading:{n:"Trading",p:3000,ic:"trend",d:"Learn the fundamentals of financial markets and how to manage risk responsibly.",pts:["How markets work","Reading charts and prices","Risk management basics","Building a trading plan"]}};
const PG=[["home","Home"],["courses","Courses"],["how","How It Works"],["faq","FAQ"],["enrol","Enrol"]];
const ic=n=>'<svg class="i"><use href="#'+n+'"/></svg>';
const kes=n=>"KSh "+n.toLocaleString("en-KE");
let pick=null;
const card=k=>{const c=C[k];return `<div class="clay"><div class="ic">${ic(c.ic)}</div><h3>${c.n}</h3><p>${c.d}</p><div class="price">${kes(c.p)}</div><div class="row" style="margin-top:16px"><button class="btn p" data-enrol="${k}">Enrol ${ic("arrow")}</button></div></div>`};
const P={
home:()=>`<div class="page"><section class="hero"><span class="tag">${ic("book")} Online courses</span><h1>Learn skills that <span>grow</span> with you.</h1><p>Pick a course, pay securely by M-Pesa and message us on WhatsApp to get started.</p><div class="row"><button class="btn p" data-go="courses">View courses ${ic("arrow")}</button><button class="btn s" data-go="enrol">Enrol now</button></div></section>
<section style="margin-top:30px"><div class="grid">${card("freelancing")}${card("trading")}</div></section>
<section style="margin-top:56px"><h2>Simple, in three steps</h2><div class="grid"><div class="clay"><div class="num">1</div><h3>Choose</h3><p>Select Freelancing or Trading.</p></div><div class="clay"><div class="num">2</div><h3>Pay</h3><p>Send the fee to our Pochi la Biashara number.</p></div><div class="clay"><div class="num">3</div><h3>Confirm</h3><p>Message us on WhatsApp with your payment details.</p></div></div></section></div>`,
courses:()=>`<div class="page"><span class="tag">${ic("book")} Courses</span><h1>Two courses. One clear path.</h1><div class="grid" style="margin-top:26px">${["freelancing","trading"].map(k=>{const c=C[k];return `<div class="clay"><div class="ic">${ic(c.ic)}</div><h2>${c.n}</h2><p>${c.d}</p><ul class="list">${c.pts.map(x=>`<li>${ic("check")}<span>${x}</span></li>`).join("")}</ul><div class="price">${kes(c.p)}</div><div class="row" style="margin-top:16px"><button class="btn p" data-enrol="${k}">Enrol ${ic("arrow")}</button></div></div>`}).join("")}</div></div>`,
how:()=>`<div class="page"><span class="tag">${ic("clock")} How it works</span><h1>From payment to learning.</h1><div class="grid" style="margin-top:26px">
<div class="clay"><div class="ic">${ic("book")}</div><h3>1. Choose a course</h3><p>Freelancing is ${kes(2000)}. Trading is ${kes(3000)}.</p></div>
<div class="clay"><div class="ic">${ic("phone")}</div><h3>2. Pay by M-Pesa</h3><p>Open M-Pesa, choose Pochi la Biashara and send to ${POCHI}.</p></div>
<div class="clay"><div class="ic">${ic("chat")}</div><h3>3. Message us</h3><p>Send your name and M-Pesa confirmation code on WhatsApp.</p></div>
<div class="clay"><div class="ic g">${ic("shield")}</div><h3>4. We confirm</h3><p>We check the payment in our M-Pesa records, then add you to the course WhatsApp group where the lessons are posted.</p></div></div>
<div class="row"><button class="btn p" data-go="enrol">Start enrolment ${ic("arrow")}</button></div></div>`,
faq:()=>{const f=[["How do I pay?","Send the course fee to Pochi la Biashara on "+POCHI+", then message us on WhatsApp."],["How much are the courses?","Freelancing is "+kes(2000)+" and Trading is "+kes(3000)+"."],["When do I get access?","After we confirm your payment in our M-Pesa records."],["Are fees refundable?","No. All course fees are non-refundable once paid."],["How are lessons delivered?","Mostly as large pieces of information posted by the admin in a WhatsApp group."],["Do you guarantee I will earn money?","No. Courses are educational and no income or profit is guaranteed."],["Will you ask for my M-Pesa PIN?","Never. Do not share your PIN or any one-time code with anyone."]];
return `<div class="page"><span class="tag">${ic("shield")} FAQ</span><h1>Questions, answered.</h1><div class="acc">${f.map((x,i)=>`<div class="clay" style="padding:20px 24px"><button class="q" aria-expanded="false" data-q="${i}">${x[0]}${ic("chev")}</button><div class="a" id="a${i}"><div><p>${x[1]}</p></div></div></div>`).join("")}</div></div>`},
terms:()=>`<div class="page terms"><span class="tag">${ic("shield")} Terms</span><h1>User Agreement</h1><p>Last updated: 19 October 2026. By paying for a course you agree to these terms.</p>
<div class="clay warn"><h3 style="margin-top:0">Fees are non-refundable</h3><p style="margin:0">All course fees (${kes(2000)} for Freelancing and ${kes(3000)} for Trading) are non-refundable once paid, whether or not you read, use or finish the material.</p></div>
<div class="clay" style="margin-top:22px"><h3 style="margin-top:0">How the lessons are delivered</h3><p>Lessons are mainly large pieces of written information posted by the admin in a WhatsApp group. There are no live classes unless the admin announces otherwise. You learn at your own pace from the posts.</p>
<h3>Payment and access</h3><p>Pay to Pochi la Biashara ${POCHI}, then send your name and M-Pesa confirmation code on WhatsApp. Access (being added to the group) is arranged after we confirm the payment in our M-Pesa records.</p>
<h3>No guarantees</h3><p>Courses are educational only. We do not guarantee any income, profit or result. Trading involves risk and you can lose money. Nothing taught is financial advice.</p>
<h3>Conduct</h3><p>Do not share, copy or resell course content. Members who break this or abuse others may be removed from the group without a refund.</p>
<h3>Your information</h3><p>We only receive the details you send on WhatsApp, such as your name, phone number and M-Pesa code. We use them to confirm payment and give access, and do not sell them. We will never ask for your M-Pesa PIN or one-time codes.</p>
<h3>Contact</h3><p style="margin:0">Questions? Message us on WhatsApp at +1 (773) 724-5875.</p></div>
<div class="row"><button class="btn p" data-go="enrol">Continue to enrol ${ic("arrow")}</button></div></div>`,
enrol:()=>`<div class="page"><span class="tag">${ic("arrow")} Enrol</span><h1>Choose your course.</h1><div class="pick">${Object.keys(C).map(k=>`<button class="opt" data-pick="${k}" aria-pressed="${pick===k}"><div class="ic">${ic(C[k].ic)}</div><b>${C[k].n}</b><span class="price">${kes(C[k].p)}</span></button>`).join("")}</div>
<div class="pay ${pick?"on":""}" id="pay"><div class="clay"><h2>Pay for <span id="cn"></span></h2><p>Open M-Pesa, choose <b>Pochi la Biashara</b> and send <b id="am"></b> to:</p><div class="big">${ic("phone")} ${POCHI}</div><label class="chk sm" for="ag"><input type="checkbox" id="ag"><span>I agree to the <a href="#/terms" data-go="terms" style="color:var(--blue);font-weight:700">Terms &amp; Conditions</a> (fee is non-refundable)</span></label>
<label for="nm">Your name</label><input type="text" id="nm" autocomplete="name"><label for="cd">M-Pesa confirmation code</label><input type="text" id="cd" autocapitalize="characters" autocomplete="off">
<div class="row"><a class="btn w" id="wa" aria-disabled="true" href="#" target="_blank" rel="noopener">${ic("chat")} Send on WhatsApp</a></div>
<p class="note" style="margin-top:16px">Fees are non-refundable. Access is arranged after we confirm your payment. We never ask for your M-Pesa PIN or one-time codes.</p></div></div></div>`
};
const SK=`<div class="page"><div class="sk" style="height:22px;width:140px"></div><div class="sk" style="height:56px;width:80%;margin:18px 0"></div><div class="sk" style="height:56px;width:55%"></div><div class="sk" style="height:18px;width:70%;margin:22px 0"></div><div class="grid" style="margin-top:30px"><div class="sk" style="height:230px;border-radius:30px"></div><div class="sk" style="height:230px;border-radius:30px"></div></div></div>`;
const app=document.getElementById("app");let cur="home",t;
function wa(){if(!pick)return;const c=C[pick];const m="Hello Riortech, I have paid "+kes(c.p)+" for the "+c.n+" course via Pochi la Biashara ("+POCHI+").\nName: "+(nm.value||"-")+"\nM-Pesa code: "+(cd.value||"-");const a=document.getElementById("wa");a.href="https://wa.me/"+WA+"?text="+encodeURIComponent(m+"\nI agree to the Terms and understand the fee is non-refundable.");a.setAttribute("aria-disabled",ag.checked?"false":"true")}
function showPay(){if(!pick)return;const c=C[pick];pay.classList.add("on");cn.textContent=c.n;am.textContent=kes(c.p);document.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pick===pick));wa()}
function go(p){cur=p;history.replaceState(null,"","#/"+p);app.innerHTML=SK;scrollTo({top:0});clearTimeout(t);
document.querySelectorAll("#nav button,#dr button").forEach(b=>b.classList.toggle("on",b.dataset.go===p));
t=setTimeout(()=>{app.innerHTML=P[p]();if(p==="enrol"){showPay();nm.oninput=cd.oninput=ag.onchange=wa}},550)}
const menu=PG.map(([k,l])=>`<button data-go="${k}">${l}</button>`).join("");
nav.innerHTML=menu;dr.innerHTML=menu;fl.innerHTML=PG.map(([k,l])=>`<button data-go="${k}">${l}</button>`).join("")+`<button data-go="terms">Terms &amp; Refund Policy</button><a class="btn w" style="min-height:44px;padding:0 18px" href="https://wa.me/${WA}" target="_blank" rel="noopener">${ic("chat")} WhatsApp</a>`;
mb.onclick=()=>{const o=dr.classList.toggle("open");mb.setAttribute("aria-expanded",o);mb.innerHTML=ic(o?"x":"menu")};
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"),en=e.target.closest("[data-enrol]"),pk=e.target.closest("[data-pick]"),q=e.target.closest("[data-q]");
if(g){dr.classList.remove("open");mb.innerHTML=ic("menu");go(g.dataset.go)}
else if(en){pick=en.dataset.enrol;go("enrol")}
else if(pk){pick=pk.dataset.pick;showPay()}
else if(q){const a=document.getElementById("a"+q.dataset.q),o=a.classList.toggle("open");q.setAttribute("aria-expanded",o)}});
const h=location.hash.replace("#/","");go(P[h]?h:"home");
</script>
</body>
